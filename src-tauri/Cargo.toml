[package]
name = "KruztyDynamics"
version = "1.0.0"
description = "Also known as Kizzy | A Discord Rich Presence manager for Android that (soon to be) rewritten with Rust in backend and React+TailwindCSS in frontend using Tauri framework. The sole purpose of this repo is to make \"Experimental\" feature into full fledged working module, which will be renamed into \"Dynamics\". Whilst adding personal features to it..."
authors = ["Seiraneko"]
license = ""
repository = "https://github.com/LlanderSei/Kruzty-Dynamics"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
